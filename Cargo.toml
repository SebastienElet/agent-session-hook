[package]
name = "agent-session-hook"
version = "0.1.0"
edition = "2024"
description = "Opt-in session-end webhooks for coding agents."
license = "BSD-2-Clause"
repository = "https://github.com/SebastienElet/agent-session-hook"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
curl = "=0.4.51"
http = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"

[dev-dependencies]
tempfile = "=3.27.0"
